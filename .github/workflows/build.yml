name: Build JOMAMBO APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant permission
        run: chmod +x gradlew

      - name: Fix Package and Constants
        run: |
          if [ -d "app/src/main/java/com/example" ]; then
            mkdir -p app/src/main/java/com/jomambo/app
            cp -r app/src/main/java/com/example/* app/src/main/java/com/jomambo/app/ 2>/dev/null || true
            rm -rf app/src/main/java/com/example
          fi
          find app/src/main/java -name "*.kt" -exec sed -i 's/package com.example/package com.jomambo.app/g' {} \;
          find app/src/main/java -name "*.kt" -exec sed -i 's/import com.example/import com.jomambo.app/g' {} \;
          if ! grep -q "const val SPIN_REWARD" app/src/main/java/com/jomambo/app/MainActivity.kt; then
            sed -i '1i private const val SPIN_REWARD = "spin_reward"' app/src/main/java/com/jomambo/app/MainActivity.kt
          fi

      - name: Fix KSP for Gradle 9.3
        run: |
          echo "org.gradle.configuration-cache=false" >> gradle.properties
          echo "ksp.incremental=false" >> gradle.properties
          sed -i '/ksp.useKSP2/d' gradle.properties || true
          echo "ksp.useKSP2=true" >> gradle.properties

      - name: Build APK
        run: ./gradlew --no-daemon --no-configuration-cache clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JOMAMBO-APK-READY
          path: app/build/outputs/apk/debug/*.apk
