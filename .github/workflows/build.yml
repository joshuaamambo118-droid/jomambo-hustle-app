name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant permission
        run: chmod +x gradlew
      - name: Fix KSP Bug
        run: |
          echo "org.gradle.configuration-cache=false" >> gradle.properties
          echo "ksp.incremental=false" >> gradle.properties
          sed -i '/ksp.useKSP2/d' gradle.properties
          echo "ksp.useKSP2=true" >> gradle.properties
      - name: Build APK
        run: ./gradlew --no-daemon --no-configuration-cache clean assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JOMAMBO-APK
          path: app/build/outputs/apk/debug/*.apk
