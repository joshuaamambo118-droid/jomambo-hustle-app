name: Build JOMAMBO APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - run: chmod +x gradlew
      - name: Build APK
        run: ./gradlew --no-daemon --refresh-dependencies clean assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: JOMAMBO-APK-READY
          path: app/build/outputs/apk/debug/*.apk
